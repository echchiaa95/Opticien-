
name: Build and Deploy OpticFlow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: opticflow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -e

          if [ -f "package.json" ]; then
            echo "Project files already exist in repository root."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No package.json or project ZIP found."
              echo "Upload the project files or the OpticFlow ZIP."
              exit 1
            fi

            mkdir -p .opticflow-extracted
            unzip -oq "$ZIP_FILE" -d .opticflow-extracted

            PACKAGE_FILE="$(find .opticflow-extracted \
              -maxdepth 6 -type f -name package.json \
              -not -path '*/node_modules/*' | head -n 1)"

            if [ -z "$PACKAGE_FILE" ]; then
              echo "ERROR: package.json not found inside ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            echo "Project located at: $PROJECT_DIR"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Build project
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          test -f "$PROJECT_DIR/dist/index.html"
          echo "Build output verified."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/${{ env.PROJECT_DIR }}/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
